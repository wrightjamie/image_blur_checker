<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Analyzer Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css?v=1.1.0">
</head>
<body>
    <div class="app-container">
        <header class="glass-header">
            <div>
                <h1>Image Analyzer <span id="app-version-badge" style="font-size: 0.8rem; font-weight: normal; background: rgba(255,255,255,0.1); padding: 3px 8px; border-radius: 12px; margin-left: 10px; opacity: 0.8;"></span></h1>
                <div id="scan-progress-container" style="display: none; margin-top: 10px;">
                    <div style="display: flex; justify-content: space-between; font-size: 0.8rem; margin-bottom: 5px;">
                        <span>Scan Progress:</span>
                        <span id="scan-progress-text">0 / 0</span>
                    </div>
                    <div style="width: 100%; max-width: 300px; height: 8px; background: rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden;">
                        <div id="scan-progress-bar" style="height: 100%; width: 0%; background: var(--primary-color); transition: width 0.3s;"></div>
                    </div>
                </div>
            </div>
            <div class="actions">
                <button id="scan-btn" class="btn primary">Run Scan in Background</button>
            </div>
        </header>

        <main>
            <section class="controls-section glass-panel">
                <div class="control-group">
                    <label for="blur-threshold">Blur Threshold: <span id="threshold-val">100</span></label>
                    <input type="range" id="blur-threshold" min="0" max="100" step="1" value="37">
                    <small>Images with a blur score (variance) below this value are considered blurred.</small>
                </div>
            </section>

            <div class="tabs">
                <button class="tab-btn active" data-tab="blurred">Blurred Images (<span id="blur-count">0</span>)</button>
                <button class="tab-btn" data-tab="duplicates">Duplicates (<span id="dup-count">0</span>)</button>
                <button class="tab-btn" data-tab="settings">Settings</button>
            </div>

            <section id="blurred-tab" class="tab-content active">
                <div class="grid" id="blurred-grid">
                    <!-- Cards will be injected here -->
                </div>
                <div class="pagination" id="blur-pagination">
                    <button class="btn secondary" id="blur-prev">Previous</button>
                    <span id="blur-page-info">Page 1 of 1</span>
                    <button class="btn secondary" id="blur-next">Next</button>
                </div>
            </section>

            <section id="duplicates-tab" class="tab-content">
                <div class="duplicates-container" id="duplicates-container">
                    <!-- Duplicate groups will be injected here -->
                </div>
                <div class="pagination" id="dup-pagination">
                    <button class="btn secondary" id="dup-prev">Previous</button>
                    <span id="dup-page-info">Page 1 of 1</span>
                    <button class="btn secondary" id="dup-next">Next</button>
                </div>
            </section>

            <section id="settings-tab" class="tab-content">
                <div class="glass-panel" style="max-width: 600px; padding: 20px;">
                    <h3>Ignore Patterns (Wildcards)</h3>
                    <p style="font-size: 0.9rem; color: #ccc; margin-bottom: 15px;">
                        Add file or folder patterns to skip during the scan. Enter one pattern per line.<br>
                        Example: <code>*/@eaDir/*</code> or <code>*.thumbnail</code>
                    </p>
                    <textarea id="ignore-patterns" rows="6" style="width: 100%; padding: 10px; border-radius: 4px; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); color: white; margin-bottom: 15px; resize: vertical;"></textarea>
                    <button id="save-settings-btn" class="btn primary">Save Settings</button>
                    <span id="settings-status" style="margin-left: 10px; color: #4ade80; opacity: 0; transition: opacity 0.3s;">Saved!</span>
                </div>
            </section>
        </main>
    </div>
    <script src="/static/app.js?v=1.1.0"></script>
</body>
</html>
