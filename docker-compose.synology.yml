version: '3.8'

services:
  app:
    # Instead of building on the NAS, you usually want to build the image locally and push to Docker Hub, 
    # OR you can map the code as a volume and use the official python image if you don't want to build.
    # However, since you are cloning the repo to your NAS, you can build it on the NAS:
    build: .
    container_name: image-analyzer
    ports:
      - "8000:8000"
    volumes:
      # Map your Synology Photo or image folder here.
      # For example, if your photos are in /volume1/photo on your NAS:
      - /volume1/photo:/images
      
      # Map the application state to a persistent folder on your NAS
      # For example, create a folder in /volume1/docker/image-analyzer-data
      - /volume1/docker/image-analyzer-data:/app/data
    restart: always
    environment:
      - IMAGE_DIR=/images
      - STATE_FILE=/app/data/state.json
      # Optional: set timezone to your local timezone (e.g., Europe/London)
      - TZ=UTC
